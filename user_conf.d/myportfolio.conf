# Tracks IPs in 10MB memory, max 1 request per min
limit_req_zone $binary_remote_addr zone=timeline_limit:10m rate=1r/m;

server {
    listen 80;
    server_name andrew-lai.duckdns.org;

    if ($host = andrew-lai.duckdns.org) {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name andrew-lai.duckdns.org;

    # Apply rate limiting specifically to the POST endpoint
    location = /api/timeline_post {
        limit_req zone=timeline_limit burst=0 nodelay;
        proxy_pass http://myportfolio:5000/api/timeline_post;
    }

    # Catch-all location for remainder of site
    location / {
        proxy_pass http://myportfolio:5000/;
    }

    # Load the certificate files.
    ssl_certificate /etc/letsencrypt/live/myportfolio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myportfolio/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/myportfolio/chain.pem;
}
